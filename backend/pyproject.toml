[project]
name = "falconvqa-backend"
version = "0.1.0"
description = "HTTP API for the FalconVQA frontend, built on the vidra library."
requires-python = ">=3.11,<3.14"
dependencies = [
    "vidra[all]",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "httpx",
    "azure-storage-blob>=12.31.1",
]

[tool.uv]
package = false

[tool.uv.sources]
vidra = { path = "../vidra", editable = true }
